<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Nurul Hasanah</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: #333;
  }
  .portal {
    background: #fff;
    width: 100%;
    max-width: 640px;
    padding: 40px 32px;
    border-radius: 20px;
    box-shadow: 0 20px 45px rgba(0,0,0,.25);
    text-align: center;
  }
  h1 { color: #4c3a8e; margin-bottom: 10px; font-size: 30px; }
  p { color: #666; margin-bottom: 30px; }
  .buttons { display: grid; gap: 14px; }
  a.btn {
    display: block;
    padding: 16px 20px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 17px;
    color: #fff;
    background: #667eea;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  a.btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,.18);
    background: #5a6fd8;
  }
  a.btn:nth-child(2) { background: #38b2ac; }
  a.btn:nth-child(2):hover { background: #2c9a94; }
  a.btn:nth-child(3) { background: #ed8936; }
  a.btn:nth-child(3):hover { background: #dd6b20; }
  a.btn:nth-child(4) { background: #e53e3e; }
  a.btn:nth-child(4):hover { background: #c53030; }
  footer { margin-top: 28px; font-size: 13px; color: #999; }
</style>
</head>
<body>
  <main class="portal">
    <h1>Portal Nurul Hasanah</h1>
    <p>Silakan pilih salah satu halaman atau tugas di bawah ini.</p>

    <div class="buttons">
      <a class="btn" href="biodata.html">1. Biodata Diri</a>
      <a class="btn" href="form-biodata.html">2. Form Pengisian Biodata</a>
      <a class="btn" href="survey-gopay.html">3. Survey Kepuasan Pengguna GoPay</a>
      <a class="btn" href="tugas-akhir.html">4. Tugas Akhir</a>
    </div>

    <footer>&copy; 2026 Nurul Hasanah</footer>
  </main>
</body>
</html>
