<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Nurul Hasanah</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  body {
    min-height:100vh;
    background:linear-gradient(135deg,#fff6e5,#ffe3f1,#e3f2ff);
    color:#333;
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }

  .bubble {
    position:fixed;
    border-radius:50%;
    opacity:.35;
    animation:float 8s ease-in-out infinite;
    z-index:0;
  }
  @keyframes float {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-25px); }
  }

  .portal {
    position:relative;
    z-index:1;
    width:100%;
    max-width:640px;
    background:#ffffffcc;
    backdrop-filter:blur(8px);
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
    padding:45px 32px;
    text-align:center;
    animation:pop 1s ease;
  }
  @keyframes pop {
    from { transform:scale(.9); opacity:0; }
    to { transform:scale(1); opacity:1; }
  }

  h1 {
    font-size:2.2rem;
    color:#ff6b9d;
    margin-bottom:8px;
  }
  .tagline {
    color:#7a6a8a;
    margin-bottom:32px;
  }

  .buttons {
    display:grid;
    gap:14px;
  }

  .btn {
    display:block;
    text-decoration:none;
    background:#fff;
    color:#ff6b9d;
    font-weight:600;
    font-size:1.05rem;
    padding:16px 20px;
    border-radius:999px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
    transition:.25s;
  }
  .btn:hover {
    background:#ff6b9d;
    color:#fff;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(255,107,157,.25);
  }

  .btn:nth-child(2) { color:#7c4dff; }
  .btn:nth-child(2):hover { background:#7c4dff; color:#fff; box-shadow:0 10px 20px rgba(124,77,255,.25); }

  .btn:nth-child(3) { color:#38b2ac; }
  .btn:nth-child(3):hover { background:#38b2ac; color:#fff; box-shadow:0 10px 20px rgba(56,178,172,.25); }

  .btn:nth-child(4) { color:#ff8a3d; }
  .btn:nth-child(4):hover { background:#ff8a3d; color:#fff; box-shadow:0 10px 20px rgba(255,138,61,.25); }

  footer {
    margin-top:32px;
    color:#8a7a9a;
    font-size:.9rem;
  }
  .emoji {
    display:inline-block;
    animation:bounce 1.5s infinite;
  }
  @keyframes bounce {
    0%,100% { transform:translateY(0); }
    50% { transform:translateY(-8px); }
  }

  @media (max-width:480px) {
    .portal { padding:32px 20px; }
    h1 { font-size:1.7rem; }
    .btn { font-size:.98rem; }
  }
</style>
</head>
<body>

<div class="bubble" style="width:80px;height:80px;background:#ffd6e8;top:10%;left:5%"></div>
<div class="bubble" style="width:50px;height:50px;background:#d6eaff;top:30%;right:8%;animation-delay:1s"></div>
<div class="bubble" style="width:100px;height:100px;background:#fff3c4;bottom:10%;left:15%;animation-delay:2s"></div>

<main class="portal">
  <h1>Halo, Saya Nurul Hasanah <span class="emoji">🌸</span></h1>
  <p class="tagline">Selamat datang di portal website saya — silakan pilih halaman atau tugas di bawah ini!</p>

  <div class="buttons">
    <a class="btn" href="biodatadiri.html">1. Biodata Diri</a>
    <a class="btn" href="kumpulbiodata.html">2. Form Pengisian Biodata</a>
    <a class="btn" href="surveygopay.html">3. Survey Kepuasan Pengguna GoPay</a>
    <a class="btn" href="keuangan kelompok.html">4. Tugas Akhir</a>
  </div>

  <footer>Dibuat dengan <span class="emoji">💖</span> oleh Nurul Hasanah</footer>
</main>

</body>
</html>
