<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biodata Nurul Hasanah</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:linear-gradient(135deg,#fff6e5,#ffe3f1,#e3f2ff); color:#333; overflow-x:hidden; }

  header { text-align:center; padding:70px 20px 40px; position:relative; }

  .bubble { position:fixed; border-radius:50%; opacity:.35; animation:float 8s ease-in-out infinite; z-index:0; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-25px)} }

  .avatar { width:150px; height:150px; border-radius:50%; object-fit:cover; border:6px solid #fff;
            box-shadow:0 10px 25px rgba(0,0,0,.15); animation:pop 1s ease; }
  @keyframes pop { from{transform:scale(.5);opacity:0} to{transform:scale(1);opacity:1} }

  h1 { margin-top:18px; font-size:2.2rem; color:#ff6b9d; }
  .tagline { color:#7a6a8a; margin-top:8px; }

  nav { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; margin:25px 0; position:relative; z-index:2; }
  nav a { text-decoration:none; background:#fff; padding:10px 20px; border-radius:999px; color:#ff6b9d;
          font-weight:600; box-shadow:0 4px 12px rgba(0,0,0,.08); transition:.25s; }
  nav a:hover { background:#ff6b9d; color:#fff; transform:translateY(-3px); }

  section { max-width:900px; margin:40px auto; padding:30px; background:#ffffffcc; backdrop-filter:blur(8px);
            border-radius:24px; box-shadow:0 8px 30px rgba(0,0,0,.08); position:relative; z-index:1;
            opacity:0; transform:translateY(30px); transition:.7s; }
  section.show { opacity:1; transform:translateY(0); }

  h2 { color:#7c4dff; margin-bottom:15px; }
  .bio p { margin:8px 0; line-height:1.7; }

  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:20px; }
